name: Delete entry (PR)

# Manually-triggered alternative to the CMS delete button (which Decap
# routes as a direct commit to main and branch protection blocks).
#
# Run from the Actions tab. The workflow validates the path, creates a
# `cms/delete/<sanitised>` branch with the file removed, and opens a PR
# already labelled `decap-cms/pending_publish`. From there the CMS publish
# gate (cms-automerge.yml) treats it like any Ready entry: it merges once
# pr-check is green and makes sure the site deploys.
#
# Token. With the CMS_BOT_TOKEN secret set, the push and the PR are made as
# the No2UID account and every workflow starts normally. Without it they
# are made with GITHUB_TOKEN, attributed to github-actions[bot], and GitHub
# holds the PR's workflow runs for approval: whoever triggered this must
# open the Actions tab and click "Approve and run" on the waiting pr-check
# and CMS publish gate runs for the new branch.
#
# Allowed paths: anything inside `src/content/` or `public/media/`. Any
# other path is rejected — you can't use this workflow to nuke
# `astro.config.mjs` or workflow files.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to delete, relative to repo root (e.g. src/content/update/2024-…md, public/media/foo.jpg). One file per run.'
        required: true
        type: string
      reason:
        description: 'Why? Goes in the PR body (optional but encouraged).'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  open-delete-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CMS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      USING_BOT_PAT: ${{ secrets.CMS_BOT_TOKEN != '' }}
    steps:
      # Pinned to commit SHA — tag in comment is the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CMS_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate path
        env:
          P: ${{ inputs.path }}
        run: |
          set -euo pipefail
          case "$P" in
            /*|*..*|*'*'*|*'?'*|*'['*) echo "::error::path must be repo-relative and free of .. or globs"; exit 1 ;;
          esac
          case "$P" in
            src/content/*|public/media/*) ;;
            *) echo "::error::path must start with src/content/ or public/media/"; exit 1 ;;
          esac
          if [ ! -f "$P" ]; then
            echo "::error::file does not exist: $P"; exit 1
          fi

      - name: Create branch + commit deletion
        env:
          P: ${{ inputs.path }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$P" | sed 's|/|-|g; s|\.|-|g' | tr -cd 'a-zA-Z0-9_-' | cut -c1-80)
          branch="cms/delete/$(date -u +%Y%m%d%H%M%S)-${slug}"
          printf 'BRANCH=%s\n' "$branch" >>"$GITHUB_ENV"
          git config user.name  "rethink-cms-bot"
          git config user.email "rethink-cms-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git rm -- "$P"
          msg=$(printf 'Delete %s\n\n%s\n\nTriggered by @%s via delete-entry.yml.' "$P" "${REASON:-}" "$ACTOR")
          git commit -m "$msg"
          git push -u origin "$branch"

      - name: Open PR, labelled Ready
        env:
          P: ${{ inputs.path }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          body=$(printf 'Permanently removes `%s` from the repo.\n\n**Triggered by:** @%s via the [delete-entry workflow](../actions/workflows/delete-entry.yml).\n**Reason:** %s\n\nLabelled `decap-cms/pending_publish`, so the CMS publish gate merges it once `pr-check` is green and the site redeploys.' "$P" "$ACTOR" "${REASON:-_(none provided)_}")
          gh pr create --base main --head "$BRANCH" --title "Delete: $P" --body "$body" \
            --label decap-cms/pending_publish
          if [ "$USING_BOT_PAT" != "true" ]; then
            echo "::warning::Opened with GITHUB_TOKEN. GitHub holds this PR's workflow runs for approval: open the Actions tab, find the waiting pr-check and CMS publish gate runs for $BRANCH, and click 'Approve and run'. Set the CMS_BOT_TOKEN secret to make this automatic."
          fi

name: Delete entry (PR)

# Manually-triggered alternative to the CMS delete button (which Decap
# routes as a direct commit to main and branch protection blocks).
#
# Run from the Actions tab. The workflow validates the path, creates a
# `cms/delete/<sanitised>` branch with the file removed, opens a PR, runs
# pr-check on it, squash-merges it once the check passes, and dispatches
# deploy.yml.
#
# It has to do all of that itself: the branch push and the PR are made
# with GITHUB_TOKEN, and GitHub never starts `pull_request` or `push`
# workflows for GITHUB_TOKEN activity. Only `workflow_dispatch` is exempt,
# which is how pr-check and deploy are started here.
#
# Allowed paths: anything inside `src/content/` or `public/media/`. Any
# other path is rejected — you can't use this workflow to nuke
# `astro.config.mjs` or workflow files.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to delete, relative to repo root (e.g. src/content/update/2024-…md, public/media/foo.jpg). One file per run.'
        required: true
        type: string
      reason:
        description: 'Why? Goes in the PR body (optional but encouraged).'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  open-delete-pr:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA — tag in comment is the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate path
        env:
          P: ${{ inputs.path }}
        run: |
          set -euo pipefail
          case "$P" in
            /*|*..*|*'*'*|*'?'*|*'['*) echo "::error::path must be repo-relative and free of .. or globs"; exit 1 ;;
          esac
          case "$P" in
            src/content/*|public/media/*) ;;
            *) echo "::error::path must start with src/content/ or public/media/"; exit 1 ;;
          esac
          if [ ! -f "$P" ]; then
            echo "::error::file does not exist: $P"; exit 1
          fi

      - name: Create branch + commit deletion
        env:
          P: ${{ inputs.path }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$P" | sed 's|/|-|g; s|\.|-|g' | tr -cd 'a-zA-Z0-9_-' | cut -c1-80)
          branch="cms/delete/$(date -u +%Y%m%d%H%M%S)-${slug}"
          printf 'BRANCH=%s\n' "$branch" >>"$GITHUB_ENV"
          git config user.name  "rethink-cms-bot"
          git config user.email "rethink-cms-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git rm -- "$P"
          msg=$(printf 'Delete %s\n\n%s\n\nTriggered by @%s via delete-entry.yml.' "$P" "${REASON:-}" "$ACTOR")
          git commit -m "$msg"
          git push -u origin "$branch"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P: ${{ inputs.path }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          body=$(printf 'Permanently removes `%s` from the repo.\n\n**Triggered by:** @%s via the [delete-entry workflow](../actions/workflows/delete-entry.yml).\n**Reason:** %s\n\nMerges automatically once `pr-check` is green, then deploys.' "$P" "$ACTOR" "${REASON:-_(none provided)_}")
          gh pr create --base main --head "$BRANCH" --title "Delete: $P" --body "$body"

      - name: Check, merge, deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$BRANCH" --repo "$REPO" --json number --jq .number)
          # Required `check` status: run pr-check on the branch explicitly.
          gh workflow run pr-check.yml --repo "$REPO" --ref "$BRANCH"
          gh pr merge --auto --squash "$pr" --repo "$REPO"
          for _ in $(seq 1 180); do
            state=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)
            case "$state" in
              MERGED)
                echo "PR #$pr merged. Dispatching deploy.yml on main."
                gh workflow run deploy.yml --repo "$REPO" --ref main
                exit 0
                ;;
              CLOSED)
                echo "PR #$pr closed without merge; no deploy."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::PR #$pr did not merge within 30 minutes; pr-check probably failed. See the PR."
          exit 1

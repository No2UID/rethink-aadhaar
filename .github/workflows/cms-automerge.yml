name: CMS publish gate

# Decap's editorial workflow opens one PR per entry on a `cms/*` branch and
# tracks the editor's status with labels:
#
#   decap-cms/draft             Draft        (Save)
#   decap-cms/pending_review    In review
#   decap-cms/pending_publish   Ready        (Publish)
#
# Only a PR carrying `decap-cms/pending_publish` may merge. Any other status
# disables auto-merge, so Save never publishes.
#
# When Ready, the job brings a stale branch up to date, merges (directly if
# the PR is already clean, otherwise via squash auto-merge), waits for the
# merge, and makes sure deploy.yml runs.
#
# Token. The job prefers the CMS_BOT_TOKEN secret (a fine-grained PAT of the
# No2UID account with contents: write and pull requests: write on this
# repo) and falls back to GITHUB_TOKEN. The difference matters twice:
#
#   - Merges and pushes made with GITHUB_TOKEN never trigger `on: push`, so
#     deploy.yml has to be dispatched by hand after the merge.
#   - A branch that fell behind `main` must be updated before it can merge
#     (branch protection requires it). An update pushed with GITHUB_TOKEN
#     is attributed to github-actions[bot], and GitHub holds the resulting
#     pr-check run for manual approval (Actions tab, "Approve and run").
#     Until someone clicks, the PR waits. With CMS_BOT_TOKEN the push is a
#     normal user push and nothing waits.
#
# `cms/delete/*` PRs from delete-entry.yml arrive already labelled Ready.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

# One run per PR; a newer event (save, status change) supersedes the one
# still polling.
concurrency:
  group: cms-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'cms/')
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CMS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      USING_BOT_PAT: ${{ secrets.CMS_BOT_TOKEN != '' }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      READY: ${{ contains(github.event.pull_request.labels.*.name, 'decap-cms/pending_publish') }}
    steps:
      - name: Hold — status is not Ready
        if: env.READY != 'true'
        run: |
          gh pr merge --disable-auto "$PR" --repo "$REPO" 2>/dev/null || true
          echo "PR #$PR ($BRANCH) is not Ready; auto-merge is off."

      - name: Bring branch up to date with main
        if: env.READY == 'true'
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "UNKNOWN" ]; then
            sleep 10
            state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
          fi
          echo "mergeStateStatus=$state"
          case "$state" in
            BEHIND)
              gh pr update-branch "$PR" --repo "$REPO"
              if [ "$USING_BOT_PAT" != "true" ]; then
                msg="This entry fell behind \`main\` and was updated by the Actions bot. GitHub holds the resulting check for approval: a maintainer must open the **Actions** tab, pick the waiting **pr-check** run for this branch, and click **Approve and run**. It merges and deploys on its own after that. Adding a \`CMS_BOT_TOKEN\` secret removes this step (see public/admin/README.md)."
                gh pr comment "$PR" --repo "$REPO" --body "$msg"
                echo "::warning::$msg"
              fi
              ;;
            DIRTY)
              echo "::error::PR #$PR conflicts with main and cannot be published. An admin must resolve the conflict on branch $BRANCH."
              exit 1
              ;;
          esac

      - name: Merge, or arm auto-merge
        if: env.READY == 'true'
        run: |
          set -euo pipefail
          read -r state armed < <(gh pr view "$PR" --repo "$REPO" \
            --json mergeStateStatus,autoMergeRequest \
            --jq '"\(.mergeStateStatus) \(.autoMergeRequest != null)"')
          echo "mergeStateStatus=$state autoMergeAlreadyEnabled=$armed"
          if [ "$state" = "CLEAN" ]; then
            # Check already green and branch current. GitHub refuses to
            # *enable* auto-merge on a PR it could merge right now, so
            # merge it directly.
            gh pr merge --squash "$PR" --repo "$REPO"
          elif [ "$armed" = "true" ]; then
            echo "Auto-merge already enabled; nothing to do."
          else
            gh pr merge --auto --squash "$PR" --repo "$REPO"
          fi

      - name: Wait for merge, then deploy
        if: env.READY == 'true'
        run: |
          set -euo pipefail
          # 30 min cap: a check stuck in the runner queue must not leave a
          # merged PR undeployed.
          for _ in $(seq 1 180); do
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            case "$state" in
              MERGED)
                if [ "$USING_BOT_PAT" = "true" ]; then
                  echo "PR #$PR merged with CMS_BOT_TOKEN; deploy.yml runs on the push to main."
                else
                  echo "PR #$PR merged with GITHUB_TOKEN. Dispatching deploy.yml on main."
                  gh workflow run deploy.yml --repo "$REPO" --ref main
                fi
                exit 0
                ;;
              CLOSED)
                echo "PR #$PR closed without merge; no deploy."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::warning::PR #$PR did not merge within 30 minutes. The check is failing, still queued, or waiting for approval; auto-merge stays enabled. If it merges later without a deploy, run deploy.yml by hand or re-save in the CMS."
